<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House of Navi — Campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@400;500;600;700;800&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="carousel.css">
<style>
  body { justify-content: center; }
  .shelf { width: min(620px, 92vw); display: flex; flex-direction: column; gap: 28px; }
  .shelf h1 { margin: 0; font-family: var(--ff-display); font-weight: 400; font-size: clamp(48px, 9vw, 80px); line-height: 0.95; letter-spacing: -0.02em; }
  .shelf .intro { margin: 0; font-size: 16px; line-height: 1.7; color: rgba(245,221,213,0.72); max-width: 44ch; }
  .list { display: flex; flex-direction: column; border-top: 1px solid rgba(245,221,213,0.18); }
  .item { display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 24px; padding: 22px 0; border-bottom: 1px solid rgba(245,221,213,0.18); transition: padding-left 0.25s ease; }
  .item:hover { padding-left: 8px; color: var(--navi-first-light); }
  .item .no { font-size: 11px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--navi-mid-dune); }
  .item .name { font-family: var(--ff-display); font-size: 32px; line-height: 1; }
  .item .tiles { font-size: 11px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(245,221,213,0.45); }
</style>
</head>
<body>
  <div class="shelf">
    <div class="meta-bar">
      <p class="eyebrow-x accent">Instagram · 1080 × 1080</p>
      <a class="eyebrow-x mute" href="../index.html">houseofnavi.com →</a>
    </div>
    <h1>Campaigns</h1>
    <p class="intro">Swipeable previews of each Instagram carousel. Use the arrows, the numbered dots or your keyboard to move between tiles.</p>
    <div class="list">
      <a class="item" href="carousel-01.html">
        <span class="no">01</span>
        <span class="name">Introduction</span>
        <span class="tiles">5 tiles</span>
      </a>
      <a class="item" href="carousel-02.html">
        <span class="no">02</span>
        <span class="name">The Name</span>
        <span class="tiles">7 tiles</span>
      </a>
    </div>
  </div>
</body>
</html>
